<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solo Dining Chatbot</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;margin:0;padding:0}
body{background:#f0f2f5;padding:20px}
.chat-wrap{max-width:700px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 2px 12px #ddd;overflow:hidden}
.chat-header{background:#2563eb;color:#fff;padding:16px;text-align:center;font-size:20px;font-weight:bold}
#chatBox{height:450px;overflow-y:auto;padding:16px;background:#f8f9fa}
.msg{margin-bottom:14px;max-width:75%;line-height:1.5;padding:10px 14px;border-radius:18px;word-wrap:break-word}
.user{background:#2563eb;color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.bot{background:#e7f3ff;color:#111;margin-right:auto;border-bottom-left-radius:4px}
.input-area{display:flex;padding:16px;border:1px solid #eee}
#userInput{flex:1;padding:12px 14px;border:1px solid #ddd;border-radius:8px;font-size:16px;outline:none}
#sendBtn{padding:12px 22px;margin-left:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:16px}
#sendBtn:hover{background:#1d4ed8}
.video-area{margin-top:30px;text-align:center;padding:20px;background:#fff;border-radius:12px;max-width:700px;margin-left:auto;margin-right:auto}
video{width:100%;border-radius:8px;margin-bottom:16px}
.branch-buttons a{padding:10px 24px;background:#4285f4;color:#fff;text-decoration:none;border-radius:6px;display:inline-block;margin:0 8px}
.branch-buttons a:hover{background:#3367d6}
</style>
</head>
<body>
<div class="chat-wrap">
  <div class="chat-header">Solo Dining Culture Chatbot</div>
  <div id="chatBox"></div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Ask about solo dining, solo economy, restaurants...">
    <button id="sendBtn">Send</button>
  </div>
</div>
<div class="video-area">
  <p>Watch our Solo Dining interactive video:</p >
  <video src="main_video.MOV" controls></video>
  <div class="branch-buttons">
    <a href=" ">Option A: Eat Outside</a >
    <a href="B.html">Option B: Eat At Home</a >
  </div>
</div>
<script>
const ruleData = [
  {q:["hello","hi"],a:"Hello! I am your Solo Dining Culture Guide. Ask me anything about the single economy, psychological benefits, restaurant designs, or the solo lifestyle!"},
  {q:["definition","what is solo dining"],a:"Solo dining culture refers to the practice of eating out or enjoying meals alone by choice. It reflects a modern lifestyle for independent individuals. Its rise is driven by growing single populations and young people preferring freedom when eating meals."},
  {q:["why popular","reason"],a:"Many young people no longer regard dining as social activity. They want to save time and avoid awkward talks, so they choose solo dining. Many restaurants also prepare single seats and small dishes to attract solo customers."},
  {q:["loneliness","sad"],a:"Not at all! Modern solo dining rarely connects with loneliness. People enjoy peaceful dining space, and dining alone lets them pick whatever food they like freely without considering other people’s tastes."},
  {q:["benefits","advantages"],a:"The main benefit is full personal freedom. You can pick restaurants, dishes and eating pace by yourself. It also helps people relax and relieve daily pressure from work and study."},
  {q:["disadvantages","challenges"],a:"The main challenges are people may feel embarrassed in crowded diners, and some meals are designed for groups, which cannot be ordered by one guest."},
  {q:["psychology","mental"],a:"Psychologically, solo diners gain stronger control over daily life. It serves as simple therapy to escape busy social interactions and calm down your mood."},
  {q:["target audience","demographic"],a:"Most fans of solo dining are young office workers and college students. They have flexible schedules and accept independent consumption habits easily."},
  {q:["stigma","awkward"],a:"In old days, people thought eating alone meant having no friends. This opinion fades away nowadays, and solo dining becomes a trendy lifestyle choice."},
  {q:["restaurant","where to eat"],a:"Cafes, ramen shops and fast food chains are friendly for solo guests. They set counter seats facing windows for people having meals alone."},
  {q:["hotpot"],a:"Yes! Many hotpot restaurants launch small single-person pots, which satisfy diners who want various flavors without inviting other companions."},
  {q:["bbq","barbecue"],a:"Absolutely. Some barbecue stores prepare tiny meat portions and single grills, catering to customers who wish to enjoy barbecue on their own."},
  {q:["design","booth"],a:"Key designs include counter seating, small set menus and private booths. These layouts remove the sense of isolation for solo diners."},
  {q:["economy","market"],a:"Solo economy pushes catering industry to adjust product layout. Small portion dishes and one-person set meals become mainstream business choices."},
  {q:["home","cook"],a:"Cooking meals alone at home saves money and time. People can build healthy eating habits and enjoy quiet private time after daily study or work."},
  {q:["convenience store","ready meal"],a:"Prepacked food from convenience stores is popular solo dining choices. They are cheap, quick to prepare and fit busy daily schedules."},
  {q:["phone","video"],a:"Lots of people watch short videos while eating alone. This small hobby fills spare time and makes one-person meals much more enjoyable."},
  {q:["gender"],a:"Young women pay more attention to dining experience when eating alone. Young men focus more on food cost and efficiency during solo meals."},
  {q:["origin","japan"],a:"Japan developed solo dining culture early. Plenty of private dining cabins and counter seats appeared to meet local people’s demand for quiet meals."},
  {q:["media","vlog"],a:"Food vlogs spread solo dining culture online. Viewers realize eating alone is comfortable rather than lonely, and more people try this lifestyle."},
  {q:["health","nutrition"],a:"You need to arrange balanced nutrition for your daily solo meals. It is easy to choose junk food casually when no one reminds you of healthy diets."},
  {q:["trend","future"],a:"Solo dining will keep developing. More catering brands will launch exclusive services for single customers, and independent dining will turn into ordinary daily choice."},
  {q:["attract","marketing"],a:"Shops use single set menus, independent booths and friendly service to draw solo diners. Proper marketing helps them grab shares from the solo economy market."},
  {q:["order","portion"],a:"You can pick small-sized dishes to avoid food waste. Many restaurants divide original big servings into mini meals for solo visitors."},
  {q:["advice","tips"],a:"Pick cozy small restaurants if you dine outside alone. Take your time to enjoy your food and regard solo dining as a pleasant break from social life!"},
];
const defaultReply = "Sorry, I can't answer this question. Try keywords like solo dining, restaurant, solo economy, booth, tips etc.";
const chatBox = document.getElementById("chatBox");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
addBotMsg("Welcome! How about talking about solo dining culture with me?");

function sendMsg(){
  let text = userInput.value.trim().toLowerCase();
  if(!text) return;
  addUserMsg(userInput.value);
  userInput.value = "";
  setTimeout(()=>{
    let res = defaultReply;
    for(let item of ruleData){
      for(let keyword of item.q){
        if(text.includes(keyword)){
          res = item.a;
          break;
        }
      }
      if(res !== defaultReply) break;
    }
    addBotMsg(res);
  },400);
}
sendBtn.onclick = sendMsg;
userInput.onkeydown = e=>{if(e.key==="Enter") sendMsg()};

function addUserMsg(text){
  let div = document.createElement("div");
  div.className = "msg user";
  div.innerText = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}
function addBotMsg(text){
  let div = document.createElement("div");
  div.className = "msg bot";
  div.innerText = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}
</script>
</body>
</html>
