<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solo Dining Chatbot</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;margin:0;padding:0}
body{background:#f0f2f5;padding:20px}
.chat-wrap{max-width:700px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 2px 12px #ddd;overflow:hidden}
.chat-header{background:#2563eb;color:#fff;padding:16px;text-align:center;font-size:20px;font-weight:bold}
#chatBox{height:450px;overflow-y:auto;padding:16px;background:#f8f9fa}
.msg{margin-bottom:14px;max-width:75%;line-height:1.5;padding:10px 14px;border-radius:18px;word-wrap:break-word}
.user{background:#2563eb;color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.bot{background:#e5e7eb;color:#111;margin-right:auto;border-bottom-left-radius:4px}
.input-area{display:flex;gap:8px;padding:16px;border-top:1px solid #eee}
#userInput{flex:1;padding:12px 14px;border:1px solid #ddd;border-radius:8px;font-size:16px;outline:none}
#sendBtn{padding:12px 22px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:16px}
#sendBtn:hover{background:#1d4ed8}
.video-link{margin-top:30px;text-align:center}
.video-link p{font-size:16px;margin-bottom:12px;color:#333}
.video-link a{padding:10px 24px;background:#4285f4;color:#fff;text-decoration:none;border-radius:6px;display:inline-block}
.video-link a:hover{background:#3367d6}
</style>
</head>
<body>
<div class="chat-wrap">
  <div class="chat-header">Solo Dining Culture Chatbot</div>
  <div id="chatBox"></div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Ask about solo dining, solo economy, restaurants...">
    <button id="sendBtn">Send</button>
  </div>
</div>

<!-- 互动视频按钮（页面最底部） -->
<div class="video-link">
  <p>Watch our Solo Dining interactive video:</p >
  <a href=" " target="_blank">Click to open Bilibili Video</a >
</div>

<script>
// 你的全部问答规则
const ruleData = [
  {q:["hello","hi"],a:"Hello! I am your Solo Dining Culture Guide. Ask me anything about the single economy, psychological benefits, restaurant designs, or the solo lifestyle!"},
  {q:["definition","what is solo dining"],a:"Solo dining culture refers to the practice of eating out or enjoying meals alone by choice. It reflects a modern lifestyle centered on independence, autonomy, and self-care."},
  {q:["why popular","reason"],a:"Its rise is driven by rapid urbanization, an increase in single-person households, and the 'pleasing oneself' economy, where people prioritize personal comfort over forced socialization."},
  {q:["loneliness","sad"],a:"Not at all! Modern solo dining is viewed as high-quality solitude. It allows individuals to escape exhausting social obligations and focus entirely on the sensory experience of food."},
  {q:["benefits","advantages"],a:"The main benefits include complete freedom in choosing the menu without compromise, controlling your own dining pace, and saving social energy from awkward small talk."},
  {q:["disadvantages","challenges"],a:"The main challenges are the inability to sample multiple dishes without wasting food, and occasional social awkwardness when dining in traditional, family-oriented restaurants."},
  {q:["psychology","mental"],a:"Psychologically, it satisfies the modern need for personal boundaries. Dining alone serves as an effective form of mental decompression and self-healing from daily stress."},
  {q:["target audience","demographic"],a:"The core demographics are urban young professionals, single youth, introverts, and anyone seeking a brief, peaceful escape from work or family demands."},
  {q:["stigma","awkward"],a:"While it was once stigmatized as being 'friendless', society now embraces solo dining as a confident sign of independence and knowing how to enjoy life."},
  {q:["restaurant","where to eat"],a:"Excellent choices include Japanese ramen bars, conveyor-belt hotpot, convenience stores, and fast-casual cafes that offer dedicated single-row bar seating."},
  {q:["hotpot"],a:"Yes! Many hotpot brands now offer mini individual pots and partitioned booths, making solo hotpot a highly comfortable and ritualistic experience."},
  {q:["bbq","barbecue"],a:"Absolutely. Modern Yakiniku (BBQ) places now feature single-person electric grills and small-portion meat platters designed specifically for solo diners."},
  {q:["design","booth"],a:"Key interior designs include counter seating, facing-the-wall bars, removable privacy partitions, and built-in smartphone holders with charging ports."},
  {q:["economy","market"],a:"Solo dining heavily drives the 'solo economy', forcing the catering industry to adapt by offering half-portion menus, single sets, and small-packaged ready meals."},
  {q:["home","cook"],a:"Dining out saves time and offers variety, while cooking a 'solo meal' at home provides a sense of mindfulness, creative expression, and domestic ritual."},
  {q:["convenience store","ready meal"],a:"Convenience stores and high-quality ready meals are pillars of solo dining, providing fast, cost-effective, and portion-controlled options for busy individuals."},
  {q:["phone","video"],a:"This is known as the 'digital companion' phenomenon. Watching videos or TV shows while eating provides psychological companionship and helps solo diners relax."},
  {q:["gender"],a:"Studies show women often prioritize the aesthetic ambiance and emotional comfort of solo dining, whereas men tend to focus more on efficiency, portion size, and value."},
  {q:["origin","japan"],a:"As a commercial model, it matured in Japan (e.g., Ichiran Ramen), heavily influenced by hyper-individualistic urban social structures and a culture that avoids bothering others."},
  {q:["media","mukbang"],a:"Mukbang (eating broadcasts) and food vlogs offer visual and auditory companionship, reducing the sense of isolation and normalizing solo eating globally."},
  {q:["health","nutrition"],a:"Nutritional balance is vital. Since solo diners have limited dish variety per meal, it is recommended to choose nutrient-dense, small-portioned side dishes."},
  {q:["trend","future"],a:"Future trends include premium solo dining experiences, AI dining companions, and anonymous dinner-matching apps, solidifying it as a mainstream market sector."},
  {q:["attract","marketing"],a:"Restaurants can attract solo diners by offering seamless contactless mobile ordering, zero-disturbance service, and welcoming single-person combo options."},
  {q:["order","portion"],a:"Look for eateries that offer half-portions or 'tasting platters'. If you are at a standard restaurant, stick to one main dish and a small side, or take home leftovers."},
  {q:["advice","tips"],a:"Put on your headphones, queue up your favorite show, and find a restaurant with privacy booths. Take your time, savor the flavors, and enjoy your own company!"},
];
const defaultReply = "Sorry, I can't answer this question. Try keywords like solo dining, restaurant, solo economy, booth, tips etc.";

const chatBox = document.getElementById("chatBox");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

// 初始欢迎消息
addBotMsg("Welcome! How about asking me a question about Solo Dining Culture? Or try asking about solo economy, privacy booths, or benefits of eating alone.");

// 发送消息
function sendMsg(){
  let text = userInput.value.trim().toLowerCase();
  if(!text) return;
  addUserMsg(text);
  userInput.value = "";
  setTimeout(()=>{
    let reply = defaultReply;
    for(let r of ruleData){
      for(let keyword of r.q){
        if(text.includes(keyword)){
          reply = r.a;
          break;
        }
      }
      if(reply !== defaultReply) break;
    }
    addBotMsg(reply);
  },400);
}
sendBtn.onclick = sendMsg;
userInput.onkeydown = e=>{if(e.key==="Enter") sendMsg()};

// 添加用户消息
function addUserMsg(text){
  let div = document.createElement("div");
  div.className = "msg user";
  div.innerText = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}
// 添加机器人消息
function addBotMsg(text){
  let div = document.createElement("div");
  div.className = "msg bot";
  div.innerText = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}
</script>
</body>
</html>
