<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solo Dining Interactive Video Game</title>
<style>
*{box-sizing: border-box;margin:0;padding:0;font-family:Arial, Helvetica, sans-serif;}
body{max-width:720px;margin:40px auto;padding:30px;line-height:1.6;}
h1{text-align:center;color:#222;margin-bottom:30px;font-size:28px;}
/* 聊天机器人样式 */
.chatbox{border:1px solid #ddd;border-radius:12px;padding:16px;margin-bottom:30px;background:#f8f9fa;}
.chat-title{font-weight:bold;font-size:19px;margin-bottom:12px}
.chat-content{min-height:120px;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:10px;}
#userInput{width:85%;padding:9px;font-size:16px;border:1px solid #bbb;border-radius:4px;}
#sendBtn{padding:9px 16px;background:#2563eb;color:white;border:none;border-radius:4px;cursor:pointer;}
/* 视频样式 */
video{width:100%;border-radius:8px;margin:25px 0;}
/* 选择按钮区域 */
.button-area{display:flex;gap:30px;justify-content:center;margin-top:15px;}
.option-btn{padding:14px 26px;background:#2563eb;color:white;text-decoration:none;border-radius:8px;font-size:18px;transition:0.2s;}
.option-btn:hover{background:#1d4ed8;}
</style>
</head>
<body>
<!-- 页面顶部大标题 -->
<h1>Interactive Story: Choices of Solo Dining</h1>

<!-- Chatbot 聊天窗口，把你自己机器人代码填进chat-content区域 -->
<div class="chatbox">
    <div class="chat-title">Conversation Assistant</div>
    <div class="chat-content" id="chatLog">
        Chatbot content goes here, paste your chatbot code inside this block
    </div>
    <div>
        <input type="text" id="userInput" placeholder="Type your message here...">
        <button id="sendBtn">Send</button>
    </div>
</div>

<!-- 主线视频 -->
<video controls>
    <source src="main-video.mp4" type="video/mp4">
    Your browser cannot load this video.
</video>

<!-- 两个跳转按钮 -->
<div class="button-area">
    <a href=" " class="option-btn">Option A: Eat Outside</a >
    <a href="B.html" class="option-btn">Option B: Eat at Home</a >
</div>

</body>
</html>
